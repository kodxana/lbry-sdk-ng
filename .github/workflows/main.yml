name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  release-tools:
    name: release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release packaging and publication guards
        run: python3 -m unittest discover -v -s scripts/tests

  schema:
    name: generated schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          python-version: '3.13.15'
          activate-environment: true
      - run: uv pip install -r lbry/schema/requirements.txt
      - run: python scripts/regenerate_schema.py --check

  async-runner:
    name: async runner / python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Test async runner without SDK dependencies
        run: python -m unittest -v tests.unit.test_asyncio_testcase

  linux-tests:
    name: tests / linux / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [lint, unit, blockchain, claims, datanetwork, other, takeovers, transactions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Elasticsearch mmap limit
        if: matrix.suite != 'lint' && matrix.suite != 'unit'
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run Python 3.13 suite
        env:
          SUITE: ${{ matrix.suite }}
          TEST_OUTPUT_DIR: ci-results
          TEST_TIMEOUT: '1800'
        run: |
          case "$SUITE" in
            lint|unit) sh scripts/test.sh "$SUITE" ;;
            *) sh scripts/test.sh integration "$SUITE" ;;
          esac
      - name: Upload logs and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux-${{ matrix.suite }}
          path: ci-results/
          retention-days: 14

  native:
    name: tests and build / ${{ matrix.platform }}
    env:
      PYTHONFAULTHANDLER: "1"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15-intel
            platform: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          python-version: '3.13.15'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            setup.py
            docker/test-constraints.txt
            docker/build-requirements.txt
      - name: Prepare Intel macOS cryptography build
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 rust
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - name: Install Python 3.13 dependencies
        run: |
          uv pip install -c docker/test-constraints.txt pip setuptools wheel Cython
          python -m pip install -c docker/test-constraints.txt -r docker/build-requirements.txt -e '.[test]'
          python -m pip check
          mkdir -p ci-results
          python -m pip freeze > ci-results/packages.txt
      - name: Test configuration
        run: |
          python -m coverage run --source=lbry -m unittest -v tests.unit.test_conf 2>&1 | tee ci-results/config-tests.log
      - name: Test logging
        run: |
          python -m coverage run --append --source=lbry -m unittest -v tests.unit.test_cli.CLILoggingTest 2>&1 | tee ci-results/logging-tests.log
      - name: Test claim schemas
        run: |
          python -m coverage run --append --source=lbry -m unittest discover -v tests.unit.schema 2>&1 | tee ci-results/schema-tests.log
      - name: Test download startup cleanup
        run: |
          python -m coverage run --append --source=lbry -m unittest -v tests.unit.stream.test_downloader 2>&1 | tee ci-results/download-startup-tests.log
      - name: Test interrupted daemon startup
        run: |
          python -m coverage run --append --source=lbry -m unittest -v tests.unit.components.test_startup_shutdown 2>&1 | tee ci-results/startup-shutdown-tests.log
      - name: Test blob server transfers and shutdown
        run: |
          python -m coverage run --append --source=lbry -m unittest -v tests.unit.blob_exchange.test_server tests.unit.blob_exchange.test_transfer_blob tests.unit.stream.test_stream_manager.TestStreamManager.test_download_stop_resume_delete 2>&1 | tee ci-results/blob-server-tests.log
      - name: Test full wallet suite
        run: |
          python -m coverage run --append --source=lbry -m unittest discover -v tests.unit.wallet 2>&1 | tee ci-results/wallet-tests.log
      - name: Write coverage report
        if: always()
        run: python -m coverage xml -o ci-results/coverage.xml
      - name: Build macOS binary
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --additional-hooks-dir=scripts --onefile --name lbrynet lbry/extras/cli.py
      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --additional-hooks-dir=scripts --icon=icons/lbry256.ico --onefile --name lbrynet lbry/extras/cli.py
      - name: Test packaged daemon and wallet persistence
        run: |
          binary=dist/lbrynet
          if [ "$RUNNER_OS" = Windows ]; then binary=dist/lbrynet.exe; fi
          python scripts/test_binary.py "$binary" \
            --expected-version "$(python -c 'import lbry; print(lbry.__version__)')" \
            2>&1 | tee ci-results/binary-tests.log
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lbrynet-${{ matrix.platform }}
          path: dist/lbrynet*
          if-no-files-found: error
          retention-days: 14
      - name: Upload logs and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}
          path: ci-results/
          retention-days: 14

  build-linux:
    name: build / linux
    needs: [release-tools, schema, async-runner, linux-tests, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check binary
        env:
          TEST_OUTPUT_DIR: ci-results
          TEST_TIMEOUT: '1200'
        run: sh scripts/test.sh build
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lbrynet-linux
          path: ci-results/lbrynet
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-linux-build
          path: |
            ci-results/test.log
            ci-results/packages.txt
            ci-results/binary/
          retention-days: 14

  package-release:
    name: package release
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          digest-mismatch: error
      - name: Package the tested binaries, checksums and reports
        run: python3 scripts/release.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish-prerelease:
    name: publish prerelease
    needs: package-release
    if: >-
      github.repository == 'kodxana/lbry-sdk-ng' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: release
          digest-mismatch: error
      - name: Verify and publish the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
